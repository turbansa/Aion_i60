<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор TOTP (SHA-1 / SHA-256 / SHA-512)</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #cbd5e1;
      --success: #16a34a;
      --error: #dc2626;
      --code-bg: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      background: var(--card);
      width: 100%;
      max-width: 720px;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p.subtitle { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
    }
    textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      resize: vertical;
    }
    textarea:focus, select:focus { outline: none; border-color: var(--primary); }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }
    .action-row {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }
    button.btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    button.btn-primary:hover { background: var(--primary-hover); }

    .status { font-size: 13px; margin-top: 10px; min-height: 18px; font-weight: 500; }
    .status.error { color: var(--error); }
    .status.success { color: var(--success); }

    .timer-wrapper {
      margin: 18px 0 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .progress-bar {
      flex: 1;
      height: 8px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 100%;
      transition: width 0.25s linear, background-color 0.3s;
    }
    .timer-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      min-width: 75px;
      text-align: right;
    }

    .codes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    @media (max-width: 600px) {
      .codes-grid, .settings-grid { grid-template-columns: 1fr; }
    }
    .code-card {
      background: var(--code-bg);
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
    }
    .code-card:hover { border-color: var(--primary); }
    .code-card:active { transform: scale(0.98); }
    .algo-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      background: #dbeafe;
      padding: 3px 10px;
      border-radius: 99px;
      margin-bottom: 10px;
    }
    .otp-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--text);
      margin-bottom: 6px;
    }
    .copy-hint { font-size: 11px; color: var(--muted); }

    .base32-box {
      border-top: 1px solid #e2e8f0;
      padding-top: 16px;
    }
    .base32-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    button.btn-small {
      background: #e2e8f0;
      color: var(--text);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button.btn-small:hover { background: #cbd5e1; }
  </style>
</head>
<body>

<div class="container">
  <h1>Генератор TOTP для 3 алгоритмов</h1>
  <p class="subtitle">Вставьте ссылку <code>otpauth://</code> или Base64-секрет и нажмите кнопку «Получить коды».</p>

  <label for="inputUrl">Ссылка otpauth:// или секрет (Base64):</label>
  <textarea id="inputUrl" rows="4" placeholder="Вставьте ссылку вида otpauth://totp/...?secret=..." oninput="handleInput()"></textarea>

  <div class="settings-grid">
    <div>
      <label for="digits">Количество цифр:</label>
      <select id="digits" onchange="updateCodes()">
        <option value="6" selected>6 цифр (стандарт)</option>
        <option value="8">8 цифр</option>
      </select>
    </div>
    <div>
      <label for="period">Период обновления:</label>
      <select id="period" onchange="updateCodes()">
        <option value="30" selected>30 секунд (стандарт)</option>
        <option value="60">60 секунд</option>
      </select>
    </div>
  </div>

  <div class="action-row">
    <button type="button" class="btn-primary" onclick="handleInput()">Получить коды</button>
  </div>

  <div id="status" class="status"></div>

  <div class="timer-wrapper">
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    <div id="timerText" class="timer-text">— сек.</div>
  </div>

  <div class="codes-grid">
    <div class="code-card" onclick="copyCode('code-SHA1', this)">
      <div class="algo-badge">SHA-1</div>
      <div id="code-SHA1" class="otp-value">------</div>
      <div class="copy-hint">Нажмите, чтобы скопировать</div>
    </div>
    <div class="code-card" onclick="copyCode('code-SHA256', this)">
      <div class="algo-badge">SHA-256</div>
      <div id="code-SHA256" class="otp-value">------</div>
      <div class="copy-hint">Нажмите, чтобы скопировать</div>
    </div>
    <div class="code-card" onclick="copyCode('code-SHA512', this)">
      <div class="algo-badge">SHA-512</div>
      <div id="code-SHA512" class="otp-value">------</div>
      <div class="copy-hint">Нажмите, чтобы скопировать</div>
    </div>
  </div>

  <div class="base32-box">
    <div class="base32-header">
      <label for="base32Output" style="margin:0;">Секрет в Base32 (без символов «=»):</label>
      <button type="button" class="btn-small" onclick="copyBase32()">Копировать Base32</button>
    </div>
    <textarea id="base32Output" rows="3" readonly placeholder="Здесь появится ключ в формате Base32..."></textarea>
  </div>
</div>

<script>
  let currentSecretBytes = null;

  function sha1Bytes(msg) {
    const ml = msg.length * 8;
    const padLen = ((56 - (msg.length + 1) % 64) + 64) % 64;
    const buf = new Uint8Array(msg.length + 1 + padLen + 8);
    buf.set(msg);
    buf[msg.length] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(buf.length - 8, Math.floor(ml / 0x100000000), false);
    dv.setUint32(buf.length - 4, ml >>> 0, false);

    let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
    const w = new Uint32Array(80);
    const rotl = (n, s) => (n << s) | (n >>> (32 - s));

    for (let i = 0; i < buf.length; i += 64) {
      for (let j = 0; j < 16; j++) w[j] = dv.getUint32(i + j * 4, false);
      for (let j = 16; j < 80; j++) w[j] = rotl(w[j-3] ^ w[j-8] ^ w[j-14] ^ w[j-16], 1);
      let a = h0, b = h1, c = h2, d = h3, e = h4;
      for (let j = 0; j < 80; j++) {
        let f, k;
        if (j < 20) { f = (b & c) | (~b & d); k = 0x5A827999; }
        else if (j < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
        else if (j < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
        else { f = b ^ c ^ d; k = 0xCA62C1D6; }
        const temp = (rotl(a, 5) + f + e + k + w[j]) >>> 0;
        e = d; d = c; c = rotl(b, 30) >>> 0; b = a; a = temp;
      }
      h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
    }
    const out = new Uint8Array(20);
    const outDv = new DataView(out.buffer);
    [h0, h1, h2, h3, h4].forEach((v, idx) => outDv.setUint32(idx * 4, v, false));
    return out;
  }

  function sha256Bytes(msg) {
    const K = [
      0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
      0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
    ];
    const ml = msg.length * 8;
    const padLen = ((56 - (msg.length + 1) % 64) + 64) % 64;
    const buf = new Uint8Array(msg.length + 1 + padLen + 8);
    buf.set(msg);
    buf[msg.length] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(buf.length - 8, Math.floor(ml / 0x100000000), false);
    dv.setUint32(buf.length - 4, ml >>> 0, false);

    let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const w = new Uint32Array(64);
    const rotr = (n, s) => (n >>> s) | (n << (32 - s));

    for (let i = 0; i < buf.length; i += 64) {
      for (let j = 0; j < 16; j++) w[j] = dv.getUint32(i + j * 4, false);
      for (let j = 16; j < 64; j++) {
        const s0 = rotr(w[j-15], 7) ^ rotr(w[j-15], 18) ^ (w[j-15] >>> 3);
        const s1 = rotr(w[j-2], 17) ^ rotr(w[j-2], 19) ^ (w[j-2] >>> 10);
        w[j] = (w[j-16] + s0 + w[j-7] + s1) >>> 0;
      }
      let [a,b,c,d,e,f,g,h] = H;
      for (let j = 0; j < 64; j++) {
        const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        const ch = (e & f) ^ (~e & g);
        const temp1 = (h + S1 + ch + K[j] + w[j]) >>> 0;
        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const temp2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + temp1) >>> 0; d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
      }
      H = H.map((v, idx) => (v + [a,b,c,d,e,f,g,h][idx]) >>> 0);
    }
    const out = new Uint8Array(32);
    const outDv = new DataView(out.buffer);
    H.forEach((v, idx) => outDv.setUint32(idx * 4, v, false));
    return out;
  }

  function sha512Bytes(msg) {
    const K = [
      0x428a2f98d728ae22n,0x7137449123ef65cdn,0xb5c0fbcfec4d3b2fn,0xe9b5dba58189dbbcn,
      0x3956c25bf348b538n,0x59f111f1b605d019n,0x923f82a4af194f9bn,0xab1c5ed5da6d8118n,
      0xd807aa98a3030242n,0x12835b0145706fben,0x243185be4ee4b28cn,0x550c7dc3d5ffb4e2n,
      0x72be5d74f27b896fn,0x80deb1fe3b1696b1n,0x9bdc06a725c71235n,0xc19bf174cf692694n,
      0xe49b69c19ef14ad2n,0xefbe4786384f25e3n,0x0fc19dc68b8cd5b5n,0x240ca1cc77ac9c65n,
      0x2de92c6f592b0275n,0x4a7484aa6ea6e483n,0x5cb0a9dcbd41fbd4n,0x76f988da831153b5n,
      0x983e5152ee66dfabn,0xa831c66d2db43210n,0xb00327c898fb213fn,0xbf597fc7beef0ee4n,
      0xc6e00bf33da88fc2n,0xd5a79147930aa725n,0x06ca6351e003826fn,0x142929670a0e6e70n,
      0x27b70a8546d22ffcn,0x2e1b21385c26c926n,0x4d2c6dfc5ac42aedn,0x53380d139d95b3dfn,
      0x650a73548baf63den,0x766a0abb3c77b2a8n,0x81c2c92e47edaee6n,0x92722c851482353bn,
      0xa2bfe8a14cf10364n,0xa81a664bbc423001n,0xc24b8b70d0f89791n,0xc76c51a30654be30n,
      0xd192e819d6ef5218n,0xd69906245565a910n,0xf40e35855771202an,0x106aa07032bbd1b8n,
      0x19a4c116b8d2d0c8n,0x1e376c085141ab53n,0x2748774cdf8eeb99n,0x34b0bcb5e19b48a8n,
      0x391c0cb3c5c95a63n,0x4ed8aa4ae3418acbn,0x5b9cca4f7763e373n,0x682e6ff3d6b2b8a3n,
      0x748f82ee5defb2fcn,0x78a5636f43172f60n,0x84c87814a1f0ab72n,0x8cc702081a6439ecn,
      0x90befffa23631e28n,0xa4506cebde82bde9n,0xbef9a3f7b2c67915n,0xc67178f2e372532bn,
      0xca273eceea26619cn,0xd186b8c721c0c207n,0xeada7dd6cde0eb1en,0xf57d4f7fee6ed178n,
      0x06f067aa72176fban,0x0a637dc5a2c898a6n,0x113f9804bef90daen,0x1b710b35131c471bn,
      0x28db77f523047d84n,0x32caab7b40c72493n,0x3c9ebe0a15c9bebcn,0x431d67c49c100d4cn,
      0x4cc5d4becb3e42b6n,0x597f299cfc657e2an,0x5fcb6fab3ad6faecn,0x6c44198c4a475817n
    ];
    const M64 = 0xffffffffffffffffn;
    const rotr = (x, n) => ((x >> n) | (x << (64n - n))) & M64;
    const ml = BigInt(msg.length) * 8n;
    const padLen = ((112 - (msg.length + 1) % 128) + 128) % 128;
    const buf = new Uint8Array(msg.length + 1 + padLen + 16);
    buf.set(msg);
    buf[msg.length] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setBigUint64(buf.length - 16, ml >> 64n, false);
    dv.setBigUint64(buf.length - 8, ml & M64, false);

    let H = [
      0x6a09e667f3bcc908n,0xbb67ae8584caa73bn,0x3c6ef372fe94f82bn,0xa54ff53a5f1d36f1n,
      0x510e527fade682d1n,0x9b05688c2b3e6c1fn,0x1f83d9abfb41bd6bn,0x5be0cd19137e2179n
    ];
    const w = new Array(80);

    for (let i = 0; i < buf.length; i += 128) {
      for (let j = 0; j < 16; j++) w[j] = dv.getBigUint64(i + j * 8, false);
      for (let j = 16; j < 80; j++) {
        const s0 = rotr(w[j-15], 1n) ^ rotr(w[j-15], 8n) ^ (w[j-15] >> 7n);
        const s1 = rotr(w[j-2], 19n) ^ rotr(w[j-2], 61n) ^ (w[j-2] >> 6n);
        w[j] = (w[j-16] + s0 + w[j-7] + s1) & M64;
      }
      let [a,b,c,d,e,f,g,h] = H;
      for (let j = 0; j < 80; j++) {
        const S1 = rotr(e, 14n) ^ rotr(e, 18n) ^ rotr(e, 41n);
        const ch = (e & f) ^ ((~e & M64) & g);
        const temp1 = (h + S1 + ch + K[j] + w[j]) & M64;
        const S0 = rotr(a, 28n) ^ rotr(a, 34n) ^ rotr(a, 39n);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const temp2 = (S0 + maj) & M64;
        h = g; g = f; f = e; e = (d + temp1) & M64; d = c; c = b; b = a; a = (temp1 + temp2) & M64;
      }
      H = H.map((v, idx) => (v + [a,b,c,d,e,f,g,h][idx]) & M64);
    }
    const out = new Uint8Array(64);
    const outDv = new DataView(out.buffer);
    H.forEach((v, idx) => outDv.setBigUint64(idx * 8, v, false));
    return out;
  }

  function hmacBytes(hashFn, blockSize, key, message) {
    let k = key;
    if (k.length > blockSize) k = hashFn(k);
    const kPadded = new Uint8Array(blockSize);
    kPadded.set(k);

    const oKeyPad = new Uint8Array(blockSize);
    const iKeyPad = new Uint8Array(blockSize);
    for (let i = 0; i < blockSize; i++) {
      oKeyPad[i] = kPadded[i] ^ 0x5c;
      iKeyPad[i] = kPadded[i] ^ 0x36;
    }

    const inner = new Uint8Array(blockSize + message.length);
    inner.set(iKeyPad);
    inner.set(message, blockSize);
    const innerHash = hashFn(inner);

    const outer = new Uint8Array(blockSize + innerHash.length);
    outer.set(oKeyPad);
    outer.set(innerHash, blockSize);
    return hashFn(outer);
  }

  function generateTOTP(secretBytes, algo, digits, period) {
    const epoch = Math.floor(Date.now() / 1000);
    const counter = Math.floor(epoch / period);

    const counterBuf = new Uint8Array(8);
    const view = new DataView(counterBuf.buffer);
    view.setUint32(0, Math.floor(counter / 0x100000000), false);
    view.setUint32(4, counter >>> 0, false);

    let hmac;
    if (algo === 'SHA1') hmac = hmacBytes(sha1Bytes, 64, secretBytes, counterBuf);
    else if (algo === 'SHA256') hmac = hmacBytes(sha256Bytes, 64, secretBytes, counterBuf);
    else hmac = hmacBytes(sha512Bytes, 128, secretBytes, counterBuf);

    const offset = hmac[hmac.length - 1] & 0x0f;
    const binary =
      ((hmac[offset] & 0x7f) << 24) |
      ((hmac[offset + 1] & 0xff) << 16) |
      ((hmac[offset + 2] & 0xff) << 8) |
      (hmac[offset + 3] & 0xff);

    const otp = binary % Math.pow(10, digits);
    return otp.toString().padStart(digits, '0');
  }

  function base64ToBytes(base64) {
    let clean = base64.replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
    while (clean.length % 4 !== 0) clean += '=';
    const binaryString = atob(clean);
    const bytes = new Uint8Array(binaryString.length);
    for (let i = 0; i < binaryString.length; i++) {
      bytes[i] = binaryString.charCodeAt(i);
    }
    return bytes;
  }

  function bytesToBase32(bytes) {
    const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
    let bits = 0, value = 0, output = '';
    for (let i = 0; i < bytes.length; i++) {
      value = (value << 8) | bytes[i];
      bits += 8;
      while (bits >= 5) {
        output += alphabet[(value >>> (bits - 5)) & 31];
        bits -= 5;
      }
    }
    if (bits > 0) {
      output += alphabet[(value << (5 - bits)) & 31];
    }
    return output;
  }

  function handleInput() {
    const raw = document.getElementById('inputUrl').value.trim();
    const statusEl = document.getElementById('status');
    const base32El = document.getElementById('base32Output');

    if (!raw) {
      currentSecretBytes = null;
      base32El.value = '';
      statusEl.textContent = 'Пожалуйста, вставьте ссылку или ключ Base64.';
      statusEl.className = 'status error';
      resetCodes();
      return;
    }

    try {
      let base64Secret = raw;
      const qPos = raw.indexOf('?');
      if (qPos !== -1) {
        const params = new URLSearchParams(raw.substring(qPos + 1));
        if (params.has('secret')) {
          base64Secret = params.get('secret');
        }
        if (params.has('digits')) {
          document.getElementById('digits').value = params.get('digits');
        }
        if (params.has('period')) {
          document.getElementById('period').value = params.get('period');
        }
      } else if (raw.includes('secret=')) {
        const params = new URLSearchParams(raw);
        if (params.has('secret')) {
          base64Secret = params.get('secret');
        }
      }

      currentSecretBytes = base64ToBytes(base64Secret);
      base32El.value = bytesToBase32(currentSecretBytes);

      statusEl.textContent = `Ключ загружен (${currentSecretBytes.length} байт). Коды обновляются автоматически.`;
      statusEl.className = 'status success';
      updateCodes();
    } catch (e) {
      currentSecretBytes = null;
      base32El.value = '';
      statusEl.textContent = 'Ошибка: ' + e.message;
      statusEl.className = 'status error';
      resetCodes();
    }
  }

  function resetCodes() {
    ['SHA1', 'SHA256', 'SHA512'].forEach(algo => {
      document.getElementById(`code-${algo}`).textContent = '------';
    });
  }

  function updateCodes() {
    if (!currentSecretBytes) return;
    const digits = parseInt(document.getElementById('digits').value, 10);
    const period = parseInt(document.getElementById('period').value, 10);

    for (const algo of ['SHA1', 'SHA256', 'SHA512']) {
      const code = generateTOTP(currentSecretBytes, algo, digits, period);
      const mid = Math.floor(code.length / 2);
      document.getElementById(`code-${algo}`).textContent = code.slice(0, mid) + ' ' + code.slice(mid);
    }
  }

  function copyCode(elementId, cardEl) {
    const text = document.getElementById(elementId).textContent.replace(/\s+/g, '');
    if (text.includes('-')) return;
    navigator.clipboard.writeText(text).then(() => {
      const hint = cardEl.querySelector('.copy-hint');
      hint.textContent = 'Скопировано!';
      hint.style.color = '#16a34a';
      setTimeout(() => {
        hint.textContent = 'Нажмите, чтобы скопировать';
        hint.style.color = '';
      }, 1500);
    });
  }

  function copyBase32() {
    const val = document.getElementById('base32Output').value;
    if (!val) return;
    navigator.clipboard.writeText(val);
  }

  setInterval(() => {
    const period = parseInt(document.getElementById('period').value, 10);
    const epoch = Math.floor(Date.now() / 1000);
    const remaining = period - (epoch % period);

    document.getElementById('timerText').textContent = `${remaining} сек.`;
    const fill = document.getElementById('progressFill');
    fill.style.width = `${(remaining / period) * 100}%`;
    fill.style.backgroundColor = remaining <= 5 ? '#dc2626' : '#2563eb';

    if (remaining === period || remaining === period - 1) {
      updateCodes();
    }
  }, 500);
</script>

</body>
</html>
