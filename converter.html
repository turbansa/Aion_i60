<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тестер TOTP-алгоритмов (SHA1 / SHA256 / SHA512)</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #cbd5e1;
      --success: #16a34a;
      --error: #dc2626;
      --code-bg: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      background: var(--card);
      width: 100%;
      max-width: 720px;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p.subtitle { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
    }
    textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      resize: vertical;
    }
    textarea:focus, select:focus { outline: none; border-color: var(--primary); }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }
    .status { font-size: 13px; margin-top: 8px; min-height: 18px; }
    .status.error { color: var(--error); }
    .status.success { color: var(--success); }

    /* Таймер */
    .timer-wrapper {
      margin: 20px 0 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .progress-bar {
      flex: 1;
      height: 8px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 100%;
      transition: width 0.25s linear, background-color 0.3s;
    }
    .timer-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      min-width: 75px;
      text-align: right;
    }

    /* Карточки с кодами */
    .codes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    @media (max-width: 600px) {
      .codes-grid, .settings-grid { grid-template-columns: 1fr; }
    }
    .code-card {
      background: var(--code-bg);
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
    }
    .code-card:hover { border-color: var(--primary); }
    .code-card:active { transform: scale(0.98); }
    .algo-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      background: #dbeafe;
      padding: 3px 10px;
      border-radius: 99px;
      margin-bottom: 10px;
    }
    .otp-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--text);
      margin-bottom: 6px;
    }
    .copy-hint { font-size: 11px; color: var(--muted); }

    /* Блок Base32 */
    .base32-box {
      border-top: 1px solid #e2e8f0;
      padding-top: 16px;
    }
    .base32-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    button.btn-small {
      background: #e2e8f0;
      color: var(--text);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button.btn-small:hover { background: #cbd5e1; }
  </style>
</head>
<body>

<div class="container">
  <h1>Генератор TOTP для 3 алгоритмов</h1>
  <p class="subtitle">Вставьте ссылку <code>otpauth://</code> или Base64-секрет, чтобы сразу увидеть коды для SHA-1, SHA-256 и SHA-512.</p>

  <label for="inputUrl">Ссылка otpauth:// или секрет (Base64):</label>
  <textarea id="inputUrl" rows="4" placeholder="Вставьте ссылку вида otpauth://totp/...?secret=..." oninput="handleInput()"></textarea>

  <div class="settings-grid">
    <div>
      <label for="digits">Количество цифр:</label>
      <select id="digits" onchange="updateCodes()">
        <option value="6" selected>6 цифр (стандарт)</option>
        <option value="8">8 цифр</option>
      </select>
    </div>
    <div>
      <label for="period">Период обновления:</label>
      <select id="period" onchange="updateCodes()">
        <option value="30" selected>30 секунд (стандарт)</option>
        <option value="60">60 секунд</option>
      </select>
    </div>
  </div>

  <div id="status" class="status"></div>

  <div class="timer-wrapper">
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    <div id="timerText" class="timer-text">— сек.</div>
  </div>

  <div class="codes-grid">
    <div class="code-card" onclick="copyCode('code-SHA-1', this)">
      <div class="algo-badge">SHA-1</div>
      <div id="code-SHA-1" class="otp-value">------</div>
      <div class="copy-hint">Нажмите, чтобы скопировать</div>
    </div>
    <div class="code-card" onclick="copyCode('code-SHA-256', this)">
      <div class="algo-badge">SHA-256</div>
      <div id="code-SHA-256" class="otp-value">------</div>
      <div class="copy-hint">Нажмите, чтобы скопировать</div>
    </div>
    <div class="code-card" onclick="copyCode('code-SHA-512', this)">
      <div class="algo-badge">SHA-512</div>
      <div id="code-SHA-512" class="otp-value">------</div>
      <div class="copy-hint">Нажмите, чтобы скопировать</div>
    </div>
  </div>

  <div class="base32-box">
    <div class="base32-header">
      <label for="base32Output" style="margin:0;">Секрет в Base32 (без символов «=»):</label>
      <button class="btn-small" onclick="copyBase32()">Копировать Base32</button>
    </div>
    <textarea id="base32Output" rows="3" readonly placeholder="Здесь появится ключ в формате Base32..."></textarea>
  </div>
</div>

<script>
  let currentSecretBytes = null;

  function base64ToBytes(base64) {
    const clean = base64.replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
    const binaryString = atob(clean);
    const bytes = new Uint8Array(binaryString.length);
    for (let i = 0; i < binaryString.length; i++) {
      bytes[i] = binaryString.charCodeAt(i);
    }
    return bytes;
  }

  function bytesToBase32(bytes) {
    const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
    let bits = 0, value = 0, output = '';
    for (let i = 0; i < bytes.length; i++) {
      value = (value << 8) | bytes[i];
      bits += 8;
      while (bits >= 5) {
        output += alphabet[(value >>> (bits - 5)) & 31];
        bits -= 5;
      }
    }
    if (bits > 0) {
      output += alphabet[(value << (5 - bits)) & 31];
    }
    return output;
  }

  async function generateTOTP(secretBytes, algo, digits, period) {
    const epoch = Math.floor(Date.now() / 1000);
    const counter = Math.floor(epoch / period);

    // 8-байтовый счетчик (Big Endian)
    const counterBuf = new ArrayBuffer(8);
    const view = new DataView(counterBuf);
    view.setUint32(0, Math.floor(counter / 0x100000000), false);
    view.setUint32(4, counter >>> 0, false);

    // Используем встроенный Web Crypto API браузера
    const key = await crypto.subtle.importKey(
      'raw',
      secretBytes,
      { name: 'HMAC', hash: { name: algo } },
      false,
      ['sign']
    );

    const signature = await crypto.subtle.sign('HMAC', key, counterBuf);
    const hmac = new Uint8Array(signature);

    // Dynamic truncation по стандарту RFC 4226
    const offset = hmac[hmac.length - 1] & 0x0f;
    const binary =
      ((hmac[offset] & 0x7f) << 24) |
      ((hmac[offset + 1] & 0xff) << 16) |
      ((hmac[offset + 2] & 0xff) << 8) |
      (hmac[offset + 3] & 0xff);

    const otp = binary % Math.pow(10, digits);
    return otp.toString().padStart(digits, '0');
  }

  function handleInput() {
    const raw = document.getElementById('inputUrl').value.trim();
    const statusEl = document.getElementById('status');
    const base32El = document.getElementById('base32Output');

    if (!raw) {
      currentSecretBytes = null;
      base32El.value = '';
      statusEl.textContent = '';
      resetCodes();
      return;
    }

    try {
      let base64Secret = raw;
      if (raw.includes('secret=')) {
        const queryPart = raw.includes('?') ? raw.split('?') : raw;
        const params = new URLSearchParams(queryPart);
        const extracted = params.get('secret');
        if (!extracted) throw new Error('Параметр secret не найден');
        base64Secret = extracted;

        // Автоподстановка digits и period, если они есть в ссылке
        if (params.get('digits')) document.getElementById('digits').value = params.get('digits');
        if (params.get('period')) document.getElementById('period').value = params.get('period');
      }

      currentSecretBytes = base64ToBytes(base64Secret);
      base32El.value = bytesToBase32(currentSecretBytes);

      statusEl.textContent = `Ключ загружен (${currentSecretBytes.length} байт). Выберите подходящий код ниже.`;
      statusEl.className = 'status success';
      updateCodes();
    } catch (e) {
      currentSecretBytes = null;
      base32El.value = '';
      statusEl.textContent = 'Ошибка: не удалось распознать ссылку или строку Base64.';
      statusEl.className = 'status error';
      resetCodes();
    }
  }
